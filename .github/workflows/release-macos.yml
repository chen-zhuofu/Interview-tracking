name: Release macOS app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version without the v prefix (for example, 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve release version
        id: release
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${MANUAL_VERSION#v}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use semantic version format, for example: 1.0.0" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run tests
        working-directory: interview-tracker-swiftui
        run: swift test

      - name: Build DMG and ZIP
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./interview-tracker-swiftui/pack-app.sh "${{ steps.release.outputs.version }}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" \
            interview-tracker-swiftui/dist/*.dmg \
            interview-tracker-swiftui/dist/*.zip \
            interview-tracker-swiftui/dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "InterviewTracker $RELEASE_VERSION" \
            --notes "Download the DMG, open it, and drag InterviewTracker to Applications. This community build is ad-hoc signed; on first launch, macOS may require approval in System Settings > Privacy & Security." \
            --generate-notes
