{% extends "base.html" %}
{% block title %}仪表盘{% endblock %}

{% block head %}
<style>
  /* ===== Dashboard: Stat Cards ===== */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat-card {
    text-align: center;
  }
  .stat-value {
    font-size: 32px;
    font-weight: 700;
    color: var(--color-primary);
    line-height: 1.2;
  }
  .stat-label {
    font-size: 13px;
    color: var(--color-text-secondary);
    margin-top: 4px;
  }

  /* ===== Dashboard: Section ===== */
  .section {
    margin-bottom: 24px;
  }
  .section-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 16px;
  }

  /* ===== Dashboard: Stage Bars ===== */
  .stage-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .stage-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .stage-label {
    width: 70px;
    font-size: 13px;
    color: var(--color-text-secondary);
    text-align: right;
    flex-shrink: 0;
  }
  .stage-track {
    flex: 1;
    height: 22px;
    background-color: #F3F4F6;
    border-radius: 4px;
    overflow: hidden;
  }
  .stage-bar {
    height: 100%;
    border-radius: 4px;
    background-color: var(--color-primary);
    transition: width 0.3s ease;
    min-width: 0;
  }
  .stage-count {
    width: 32px;
    font-size: 13px;
    font-weight: 600;
    color: var(--color-text);
    flex-shrink: 0;
  }

  /* ===== Dashboard: Interview Cards ===== */
  .interview-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .interview-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background-color: #F9FAFB;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
  }
  .interview-info {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .interview-company {
    font-weight: 600;
    font-size: 14px;
  }
  .interview-position {
    font-size: 13px;
    color: var(--color-text-secondary);
  }
  .interview-time {
    font-size: 13px;
    color: var(--color-text-secondary);
    white-space: nowrap;
  }

  /* ===== Dashboard: Activity List ===== */
  .activity-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .activity-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--color-border);
  }
  .activity-item:last-child {
    border-bottom: none;
  }
  .activity-desc {
    font-size: 14px;
  }
  .activity-desc strong {
    font-weight: 600;
  }
  .activity-time {
    font-size: 12px;
    color: var(--color-text-secondary);
    white-space: nowrap;
    margin-left: 12px;
  }

  /* ===== Dashboard: Empty State ===== */
  .empty-state {
    text-align: center;
    padding: 32px 20px;
    color: var(--color-text-secondary);
    font-size: 14px;
  }

  /* ===== Responsive ===== */
  @media (max-width: 768px) {
    .stat-grid {
      grid-template-columns: repeat(2, 1fr);
    }
    .stage-label {
      width: 56px;
      font-size: 12px;
    }
    .interview-item {
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }
    .activity-item {
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }
    .activity-time {
      margin-left: 0;
    }
  }
</style>
{% endblock %}

{% block content %}
<!-- Stat Cards -->
<div class="stat-grid">
  <div class="card stat-card">
    <div class="stat-value" id="stat-total">--</div>
    <div class="stat-label">投递总数</div>
  </div>
  <div class="card stat-card">
    <div class="stat-value" id="stat-interviewing">--</div>
    <div class="stat-label">面试中</div>
  </div>
  <div class="card stat-card">
    <div class="stat-value" id="stat-offer">--</div>
    <div class="stat-label">已发 Offer</div>
  </div>
  <div class="card stat-card">
    <div class="stat-value" id="stat-this-week">--</div>
    <div class="stat-label">本周面试</div>
  </div>
</div>

<!-- Stage Distribution -->
<div class="card section">
  <h2 class="section-title">阶段分布</h2>
  <div id="stage-distribution">
    <div class="empty-state">暂无数据</div>
  </div>
</div>

<!-- This Week Interviews -->
<div class="card section">
  <h2 class="section-title">本周面试</h2>
  <div id="this-week-interviews">
    <div class="empty-state">暂无数据</div>
  </div>
</div>

<!-- Recent Activities -->
<div class="card section">
  <h2 class="section-title">近期活动</h2>
  <div id="recent-activities">
    <div class="empty-state">暂无数据</div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='/js/dashboard.js') }}"></script>
{% endblock %}
