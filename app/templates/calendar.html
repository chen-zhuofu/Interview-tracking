{% extends "base.html" %}
{% block title %}面试日历{% endblock %}

{% block head %}
<style>
  /* ── Calendar Page ── */
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .page-header h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0;
  }

  .calendar-section {
    margin-bottom: 32px;
  }

  .calendar-section h2 {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 12px;
    color: var(--color-text-secondary);
  }

  .date-group {
    margin-bottom: 20px;
  }

  .date-group-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--color-text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--color-border);
  }

  .interview-card {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 16px;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    margin-bottom: 8px;
    transition: box-shadow 0.15s ease;
  }

  .interview-card:hover {
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  }

  .interview-card-main {
    flex: 1;
    min-width: 0;
  }

  .interview-card-company {
    font-size: 14px;
    font-weight: 600;
    color: var(--color-text);
  }

  .interview-card-position {
    font-size: 13px;
    color: var(--color-text-secondary);
    margin-top: 2px;
  }

  .interview-card-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 6px;
    font-size: 13px;
    color: var(--color-text-secondary);
  }

  .interview-card-time {
    white-space: nowrap;
  }

  .interview-card-interviewer {
    white-space: nowrap;
  }

  .interview-card-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  /* ── Badge colors for results ── */
  .badge-pending {
    background-color: #F3F4F6;
    color: #6B7280;
  }

  .badge-passed {
    background-color: #DCFCE7;
    color: #16A34A;
  }

  .badge-failed {
    background-color: #FEE2E2;
    color: #DC2626;
  }

  /* ── Badge colors for interview types ── */
  .badge-phone {
    background-color: #E0E7FF;
    color: #4F46E5;
  }

  .badge-video {
    background-color: #EDE9FE;
    color: #7C3AED;
  }

  .badge-onsite {
    background-color: #FFF7ED;
    color: #EA580C;
  }

  /* ── Empty state ── */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--color-text-secondary);
    font-size: 14px;
  }

  /* ── Modal form extras ── */
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .modal-header h3 {
    font-size: 18px;
    font-weight: 600;
    margin: 0;
  }

  .modal-close {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: var(--color-text-secondary);
    padding: 0;
    line-height: 1;
  }

  .modal-close:hover {
    color: var(--color-text);
  }

  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 20px;
  }

  .btn-ghost {
    background: transparent;
    border-color: transparent;
    color: var(--color-text-secondary);
  }

  .btn-ghost:hover {
    background-color: #F3F4F6;
    color: var(--color-text);
  }

  .form-row {
    display: flex;
    gap: 12px;
  }

  .form-row .form-group {
    flex: 1;
  }
</style>
{% endblock %}

{% block content %}
<div class="page-header">
  <h1>面试日历</h1>
  <button class="btn btn-primary" id="add-interview-btn">添加面试</button>
</div>

<section class="calendar-section">
  <h2>近期面试</h2>
  <div id="upcoming-container"></div>
</section>

<section class="calendar-section">
  <h2>历史面试</h2>
  <div id="past-container"></div>
</section>

<!-- Add / Edit Interview Modal -->
<div class="modal-overlay" id="interview-modal" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">添加面试</h3>
      <button class="modal-close" id="modal-close-btn">&times;</button>
    </div>
    <form id="interview-form">
      <input type="hidden" id="interview-id" value="">

      <div class="form-group">
        <label class="form-label" for="application-select">投递</label>
        <select class="form-input" id="application-select" required>
          <option value="">请选择投递</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="interview-type">面试类型</label>
        <select class="form-input" id="interview-type" required>
          <option value="">请选择类型</option>
          <option value="phone">电话面</option>
          <option value="video">视频面</option>
          <option value="onsite">现场面</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="interview-date">面试时间</label>
        <input type="datetime-local" class="form-input" id="interview-date" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="interviewer">面试官</label>
          <input type="text" class="form-input" id="interviewer" placeholder="面试官姓名">
        </div>
        <div class="form-group">
          <label class="form-label" for="result">结果</label>
          <select class="form-input" id="result">
            <option value="">未定</option>
            <option value="pending">待定</option>
            <option value="passed">通过</option>
            <option value="failed">未通过</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="notes">备注</label>
        <textarea class="form-input" id="notes" placeholder="备注信息" rows="3"></textarea>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" id="modal-cancel-btn">取消</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='/js/calendar.js') }}"></script>
{% endblock %}
